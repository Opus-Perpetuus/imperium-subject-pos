# Flujo ejecutable (esquema del plan «feature maps ejecutables»). La ficha .md se genera de este archivo.
feature: pos-promociones-mayoreo
modulo: pos
titulo: Precio de mayoreo y promoción al subir la cantidad
rol: cajero
datos: [caja y almacén de prueba fijos (seed ia.*), sesión de caja abierta de ia.cajero, producto con escala de
    mayoreo y promoción activa]
inicio: /internal/pos
pasos:
- accion: clic
  ancla: pos-live-catalog
  ancla_pendiente: pos-catalogo-producto
  respaldo: {rol: button, nombre: '{{producto.nombre}}'}
  explica: Agrega el producto desde el catálogo
- accion: escribir
  ancla_pendiente: pos-linea-cantidad
  respaldo: {rol: spinbutton, nombre: Cantidad}
  texto: '12'
- accion: esperar
  espera: {visible: Mayoreo}
  backend: {api: POST /api/m/subject-pos/pos-promotion/apply, status: 200}
  captura: mayoreo
variantes: [teclado, movil-360, sin-conexion, sin-permiso]
notas: ['Pantalla Angular del núcleo (frontend/src/app/components/pos): las anclas internas son del núcleo.']
