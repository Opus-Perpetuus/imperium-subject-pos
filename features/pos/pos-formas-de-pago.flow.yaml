# Flujo ejecutable (esquema del plan «feature maps ejecutables»). La ficha .md se genera de este archivo.
feature: pos-formas-de-pago
modulo: pos
titulo: Cobrar con tarjeta, transferencia o mixto
rol: cajero
datos: ['seed:caja-prueba', 'seed:productos-pos']
inicio: /internal/pos
pasos:
- accion: clic
  ancla: pos-catalogo-producto
  respaldo: {rol: button, nombre: '{{producto.nombre}}'}
  explica: Agrega el producto desde el catálogo
- accion: tecla
  ancla: pos-cobrar
  tecla: F5
  explica: Abre el cobro (también Enter o «Cobrar ahora»)
  espera: {visible: Forma de pago}
- accion: clic
  ancla: pos-formas-de-pago
  respaldo: {rol: radiogroup, nombre: Forma de pago}
  captura: formas
- accion: clic
  ancla: pos-formas-de-pago
  respaldo: {rol: radio, nombre: Mixto}
  explica: Reparte el total entre efectivo, tarjeta y transferencia
- accion: escribir
  ancla: pos-pago-referencia
  respaldo: {rol: textbox, nombre: Referencia de pago}
  texto: IA-0001
- accion: clic
  ancla: pos-pago-finalizar
  respaldo: {rol: button, nombre: Pagar}
  backend:
    api: POST /api/pos-tickets
    status: 2xx
    campos: [payment_method, payments]
variantes: [teclado, movil-360, sin-conexion, sin-permiso]
notas: ['Pantalla Angular del núcleo (frontend/src/app/components/pos): las anclas internas son del núcleo.']
