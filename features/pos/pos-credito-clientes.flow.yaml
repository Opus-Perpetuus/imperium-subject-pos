# Flujo ejecutable (esquema del plan «feature maps ejecutables»). La ficha .md se genera de este archivo.
feature: pos-credito-clientes
modulo: pos
titulo: Venta a crédito y abono del cliente
rol: cajero
datos: [caja y almacén de prueba fijos (seed ia.*), sesión de caja abierta de ia.cajero, 'seed:productos-pos (≥1
    producto con existencia)', cliente con credito_limite]
inicio: /internal/pos
pasos:
- accion: clic
  ancla: pos-live-catalog
  ancla_pendiente: pos-catalogo-producto
  respaldo: {rol: button, nombre: '{{producto.nombre}}'}
  explica: Agrega el producto desde el catálogo
- accion: tecla
  ancla_pendiente: pos-cobrar
  tecla: F5
  explica: Abre el cobro (también Enter o «Cobrar ahora»)
  espera: {visible: Forma de pago}
- accion: clic
  ancla: pos-formas-de-pago
  respaldo: {rol: radio, nombre: Crédito}
- accion: clic
  ancla_pendiente: pos-pago-finalizar
  respaldo: {rol: button, nombre: Pagar}
  backend:
    api: POST /api/pos-tickets
    status: 2xx
    campos: [is_credit, credit_amount]
- {accion: tecla, tecla: F4}
- accion: clic
  ancla: pos-credito-clientes
  respaldo: {rol: button, nombre: Abono de cliente a crédito}
- accion: escribir
  ancla_pendiente: pos-credito-abono-importe
  respaldo: {rol: textbox, nombre: Importe}
  texto: '50'
- accion: clic
  ancla_pendiente: pos-credito-abono-confirmar
  respaldo: {rol: button, nombre: Registrar}
  backend: {api: 'GET /api/pos-tickets/estado-cuenta?cliente={{cliente.id}}', status: 200}
  captura: abono
variantes: [teclado, movil-360, sin-conexion, sin-permiso]
notas: ['Pantalla Angular del núcleo (frontend/src/app/components/pos): las anclas internas son del núcleo.']
