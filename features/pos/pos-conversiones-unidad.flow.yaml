# Flujo ejecutable (esquema del plan «feature maps ejecutables»). La ficha .md se genera de este archivo.
feature: pos-conversiones-unidad
modulo: pos
titulo: Escanear el código de la caja (12 piezas)
rol: cajero
datos: [caja y almacén de prueba fijos (seed ia.*), sesión de caja abierta de ia.cajero, producto con «Otras unidades
    de venta» caja=12]
inicio: /internal/pos
pasos:
- {accion: escanear, ancla_pendiente: pos-escaner, codigo: '{{producto.codigo_caja}}', explica: Lee el código de
    la caja con el lector}
- accion: esperar
  espera: {fila: '12'}
  captura: conversion
variantes: [teclado, movil-360, sin-conexion, sin-permiso]
notas: ['Pantalla Angular del núcleo (frontend/src/app/components/pos): las anclas internas son del núcleo.']
