# Flujo ejecutable (esquema del plan «feature maps ejecutables»). La ficha .md se genera de este archivo.
feature: pos-admin-sesiones
modulo: pos
titulo: Consultar sesiones de caja
rol: consulta
datos: [sesión de caja abierta de ia.cajero]
inicio: /internal/pos-session
pasos:
- accion: clic
  ancla: view-list-row
  respaldo: {rol: row, nombre: '{{sesion.nombre}}'}
  backend: {api: GET /api/m/subject-pos/pos-session, status: 200}
- accion: esperar
  ancla: field-cashier
  espera: {visible: Cajero}
  captura: sesion
variantes: [teclado, movil-360, sin-conexion, sin-permiso]
notas: ['Pantalla Angular del núcleo (frontend/src/app/components/pos): las anclas internas son del núcleo.']
