# Flujo ejecutable (esquema del plan «feature maps ejecutables»). La ficha .md se genera de este archivo.
feature: pos-ventas-en-espera
modulo: pos
titulo: Poner una venta en espera y recuperarla
rol: cajero
datos: ['seed:caja-prueba', 'seed:productos-pos']
inicio: /internal/pos
pasos:
- accion: clic
  ancla: pos-catalogo-producto
  respaldo: {rol: button, nombre: '{{producto.nombre}}'}
  explica: Agrega el producto desde el catálogo
- {accion: tecla, tecla: F7, explica: Deja la venta en espera}
- accion: tecla
  tecla: F8
  espera: {visible: Ventas en espera}
- accion: clic
  ancla: pos-ventas-en-espera
  respaldo: {rol: button, nombre: Recuperar}
  captura: espera
variantes: [teclado, movil-360, sin-conexion, sin-permiso]
notas: ['Pantalla Angular del núcleo (frontend/src/app/components/pos): las anclas internas son del núcleo.']
