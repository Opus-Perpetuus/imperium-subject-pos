# Flujo ejecutable (esquema del plan «feature maps ejecutables»). La ficha .md se genera de este archivo.
feature: pos-admin-tickets
modulo: pos
titulo: Consultar tickets y su forma de pago
rol: consulta
datos: [al menos 1 venta]
inicio: /internal/pos-tickets
pasos:
- accion: clic
  ancla: view-list-row
  respaldo: {rol: row, nombre: '{{venta.folio}}'}
  backend: {api: GET /api/m/subject-pos/pos-tickets, status: 200}
- accion: esperar
  ancla: field-payment_method
  espera: {visible: Forma de pago}
  captura: ticket
variantes: [teclado, movil-360, sin-conexion, sin-permiso]
notas: ['Pantalla Angular del núcleo (frontend/src/app/components/pos): las anclas internas son del núcleo.']
