# Flujo ejecutable (esquema del plan «feature maps ejecutables»). La ficha .md se genera de este archivo.
feature: pos-saldo-favor
modulo: pos
titulo: Devolver como saldo a favor y usarlo
rol: cajero
datos: ['seed:caja-prueba', 'seed:productos-pos', 'seed:cliente-credito', 'venta cerrada con cliente']
inicio: /internal/pos
pasos:
- accion: tecla
  tecla: F9
  espera: {visible: Devolución de una venta}
- accion: escribir
  ancla: pos-devolucion
  respaldo: {rol: textbox, nombre: Folio}
  texto: '{{venta.folio}}'
- {accion: tecla, tecla: Enter}
- accion: clic
  ancla: pos-devolucion-saldo-favor
  respaldo: {rol: checkbox, nombre: Reembolsar como saldo a favor del cliente}
- accion: clic
  ancla: pos-devolucion-confirmar
  respaldo: {rol: button, nombre: Registrar}
  backend: {api: 'GET /api/pos-tickets/saldo-favor?cliente={{cliente.id}}', status: 200}
- accion: clic
  ancla: pos-catalogo-producto
  respaldo: {rol: button, nombre: '{{producto.nombre}}'}
  explica: Agrega el producto desde el catálogo
- accion: tecla
  ancla: pos-cobrar
  tecla: F5
  explica: Abre el cobro (también Enter o «Cobrar ahora»)
  espera: {visible: Forma de pago}
- accion: clic
  ancla: pos-formas-de-pago
  respaldo: {rol: radio, nombre: Saldo a favor}
- accion: clic
  ancla: pos-pago-finalizar
  respaldo: {rol: button, nombre: Pagar}
  espera: {visible: Pagado con saldo a favor}
  captura: saldo
variantes: [teclado, movil-360, sin-conexion, sin-permiso]
notas: ['Pantalla Angular del núcleo (frontend/src/app/components/pos): las anclas internas son del núcleo.']
